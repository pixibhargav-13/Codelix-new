  <!-- column bodies -->
  <rect x="60" y="120" width="220" height="420" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.08)" />
  <rect x="320" y="120" width="160" height="420" rx="16" fill="rgba(124,155,255,.05)" stroke="rgba(124,155,255,.25)" />
  <rect x="520" y="120" width="220" height="420" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.08)" />

  <!-- support cards -->
  <rect x="84" y="150" width="172" height="70" rx="10" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" />
  <rect x="100" y="168" width="100" height="9" rx="4" fill="rgba(255,255,255,.18)" />
  <rect x="100" y="188" width="70" height="8" rx="4" fill="rgba(255,255,255,.1)" />

  <rect x="84" y="238" width="172" height="70" rx="10" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" />
  <rect x="100" y="256" width="110" height="9" rx="4" fill="rgba(255,255,255,.18)" />
  <rect x="100" y="276" width="70" height="8" rx="4" fill="rgba(255,255,255,.1)" />

