  <rect x="84" y="326" width="172" height="70" rx="10" fill="rgba(126,224,168,.08)" stroke="rgba(126,224,168,.5)" />
  <rect x="100" y="344" width="95" height="9" rx="4" fill="rgba(255,255,255,.22)" />
  <rect x="100" y="364" width="60" height="8" rx="4" fill="rgba(126,224,168,.7)" />

  <!-- automated arrow through handoff column -->
  <line x1="256" y1="361" x2="330" y2="361" stroke="rgba(126,224,168,.7)" stroke-width="2.5" stroke-dasharray="6 6" />
  <circle cx="400" cy="361" r="26" fill="rgba(126,224,168,.12)" stroke="rgba(126,224,168,.55)" />
  <path d="M390 361 l8 8 l14 -16" fill="none" stroke="rgba(126,224,168,.95)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="426" y1="361" x2="500" y2="361" stroke="rgba(126,224,168,.7)" stroke-width="2.5" stroke-dasharray="6 6" />

  <text x="345" y="420" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="rgba(126,224,168,.75)">AUTO-ROUTED</text>
  <text x="345" y="438" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="rgba(255,255,255,.35)">AUDIT LOGGED</text>

