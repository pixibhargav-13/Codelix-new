  <rect x="544" y="150" width="172" height="70" rx="10" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" />
  <rect x="560" y="168" width="105" height="9" rx="4" fill="rgba(255,255,255,.18)" />
  <rect x="560" y="188" width="70" height="8" rx="4" fill="rgba(255,255,255,.1)" />

  <rect x="544" y="238" width="172" height="70" rx="10" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)" stroke-dasharray="5 5" />
  <rect x="560" y="256" width="80" height="9" rx="4" fill="rgba(255,255,255,.12)" />
