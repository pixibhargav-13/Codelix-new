<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgErp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#14161f" />
    </linearGradient>
    <linearGradient id="barErp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c9bff" />
      <stop offset="100%" stop-color="#5a78dc" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgErp)" />

  <!-- sidebar -->
  <rect x="60" y="60" width="180" height="555" rx="14" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.07)" />
  <rect x="90" y="100" width="120" height="10" rx="5" fill="rgba(124,155,255,.5)" />
  <rect x="90" y="140" width="90" height="8" rx="4" fill="rgba(255,255,255,.12)" />
  <rect x="90" y="168" width="100" height="8" rx="4" fill="rgba(255,255,255,.12)" />
  <rect x="90" y="196" width="80" height="8" rx="4" fill="rgba(255,255,255,.12)" />
  <rect x="90" y="224" width="95" height="8" rx="4" fill="rgba(255,255,255,.08)" />

  <!-- top bar -->
  <rect x="260" y="60" width="880" height="60" rx="12" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.07)" />
  <rect x="284" y="82" width="160" height="16" rx="4" fill="rgba(255,255,255,.16)" />
  <circle cx="1090" cy="90" r="16" fill="rgba(124,155,255,.35)" />

  <!-- stat cards -->
  <g>
    <rect x="260" y="140" width="205" height="110" rx="14" fill="rgba(124,155,255,.07)" stroke="rgba(124,155,255,.25)" />
    <text x="284" y="180" font-family="ui-monospace,Menlo,monospace" font-size="30" fill="#fff" font-weight="700">62%</text>
    <rect x="284" y="196" width="150" height="7" rx="3.5" fill="rgba(255,255,255,.2)" />

    <rect x="480" y="140" width="205" height="110" rx="14" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.08)" />
    <text x="504" y="180" font-family="ui-monospace,Menlo,monospace" font-size="30" fill="#fff" font-weight="700">45%</text>
    <rect x="504" y="196" width="150" height="7" rx="3.5" fill="rgba(255,255,255,.15)" />

    <rect x="700" y="140" width="205" height="110" rx="14" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.08)" />
    <text x="724" y="180" font-family="ui-monospace,Menlo,monospace" font-size="30" fill="#fff" font-weight="700">99.7%</text>
    <rect x="724" y="196" width="150" height="7" rx="3.5" fill="rgba(255,255,255,.15)" />

    <rect x="920" y="140" width="220" height="110" rx="14" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.08)" />
    <text x="944" y="180" font-family="ui-monospace,Menlo,monospace" font-size="30" fill="#fff" font-weight="700">30m</text>
    <rect x="944" y="196" width="150" height="7" rx="3.5" fill="rgba(255,255,255,.15)" />
  </g>

  <!-- chart panel -->
  <rect x="260" y="270" width="500" height="345" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.08)" />
  <g>
    <rect x="300" y="480" width="46" height="100" rx="5" fill="url(#barErp)" opacity=".55" />
    <rect x="360" y="440" width="46" height="140" rx="5" fill="url(#barErp)" opacity=".7" />
    <rect x="420" y="400" width="46" height="180" rx="5" fill="url(#barErp)" opacity=".85" />
    <rect x="480" y="360" width="46" height="220" rx="5" fill="url(#barErp)" />
    <rect x="540" y="410" width="46" height="170" rx="5" fill="url(#barErp)" opacity=".75" />
    <rect x="600" y="330" width="46" height="250" rx="5" fill="url(#barErp)" opacity=".95" />
    <rect x="660" y="380" width="46" height="200" rx="5" fill="url(#barErp)" opacity=".8" />
  </g>
  <line x1="300" y1="600" x2="700" y2="600" stroke="rgba(255,255,255,.15)" stroke-width="1.5" />

  <!-- account list panel -->
  <rect x="780" y="270" width="360" height="345" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.08)" />
  <g stroke="rgba(255,255,255,.07)">
    <line x1="780" y1="340" x2="1140" y2="340" />
    <line x1="780" y1="410" x2="1140" y2="410" />
    <line x1="780" y1="480" x2="1140" y2="480" />
    <line x1="780" y1="550" x2="1140" y2="550" />
  </g>
  <circle cx="812" cy="306" r="8" fill="rgba(126,224,168,.8)" />
  <rect x="834" y="300" width="180" height="12" rx="4" fill="rgba(255,255,255,.18)" />
  <circle cx="812" cy="376" r="8" fill="rgba(232,180,120,.8)" />
  <rect x="834" y="370" width="150" height="12" rx="4" fill="rgba(255,255,255,.14)" />
  <circle cx="812" cy="446" r="8" fill="rgba(126,224,168,.8)" />
  <rect x="834" y="440" width="200" height="12" rx="4" fill="rgba(255,255,255,.14)" />
  <circle cx="812" cy="516" r="8" fill="rgba(126,224,168,.8)" />
  <rect x="834" y="510" width="170" height="12" rx="4" fill="rgba(255,255,255,.14)" />
</svg>
